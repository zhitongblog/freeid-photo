name: FreeIDPhoto
options:
  bundleIdPrefix: com.freeidphoto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FreeIDCore:
    path: .

targets:
  FreeIDPhoto:
    type: application
    platform: iOS
    sources:
      - path: Sources/FreeIDApp
    dependencies:
      - package: FreeIDCore
        product: FreeIDCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freeidphoto.app
        DEVELOPMENT_TEAM: 6NQM3XP5RF
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "8"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: "FreeID Photo uses the camera to take your ID photo on-device. Nothing is uploaded."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save your finished ID photo to your photo library."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
